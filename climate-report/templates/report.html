<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root{--ink:#17322d;--muted:#64746f;--paper:#f4f1e9;--card:#fffdf8;--line:#dfe4dc;--green:#226454;--orange:#df7540;--blue:#397e91;--shadow:0 14px 40px rgba(23,50,45,.08);--radius:22px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0,rgba(223,117,64,.1),transparent 28rem),radial-gradient(circle at 94% 5%,rgba(57,126,145,.1),transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}.page{width:min(1120px,calc(100% - 40px));margin:auto;padding-bottom:60px}header{padding:48px 0 28px}h1,h2,h3,p{margin-top:0}h1{margin-bottom:10px;font:500 clamp(44px,7vw,76px)/1 Georgia,serif;letter-spacing:-.05em}h2{font:500 38px/1.1 Georgia,serif}h3{font:500 28px/1 Georgia,serif}.subtitle{color:var(--muted);font-size:18px}.eyebrow{margin-bottom:10px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.meta{display:flex;flex-wrap:wrap;gap:8px}.meta span,.tag{padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#ffffff80;color:var(--muted);font-size:10px;font-weight:750}.card{border:1px solid #17322d16;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}section{margin-bottom:46px}.hero{display:grid;grid-template-columns:1.3fr .7fr;overflow:hidden}.hero>div{padding:32px}.hero p{margin:0;font:400 clamp(22px,3vw,32px)/1.3 Georgia,serif}.hero aside{display:grid;min-height:220px;place-content:center;padding:25px;background:var(--green);color:white;text-align:center}.hero aside b{font:500 54px Georgia,serif}.hero aside span{font-size:11px;text-transform:uppercase}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.kpi{display:flex;min-height:135px;flex-direction:column;padding:19px}.kpi>span{color:var(--muted);font-size:10px;text-transform:uppercase}.kpi>b{margin:15px 0 7px;font:500 34px Georgia,serif}.kpi>small{color:var(--muted)}.section-head{margin-bottom:18px}.rooms{display:grid;gap:18px}.room{display:grid;grid-template-columns:230px 1fr;overflow:hidden}.room-intro{padding:25px;background:#edf3ed}.room-intro .main-value{margin:20px 0 8px;font:500 38px Georgia,serif}.room-intro p{color:var(--muted);font-size:12px}.room-body{padding:25px}.room-body svg{width:100%;height:90px}.room-body line{stroke:var(--line)}.room-body polyline{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ranges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ranges div{padding:11px;border-radius:12px;background:#f4f4ee}.ranges span,.outdoor span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.ranges b{font-size:12px}.daily-wrap{grid-column:1/-1;overflow-x:auto;border-top:1px solid var(--line);padding:15px 22px}.daily{width:100%;border-collapse:collapse}.daily td{min-width:112px;padding:8px;border-right:1px solid var(--line)}.daily span,.daily small{display:block;color:var(--muted);font-size:9px}.daily b{display:block;font:500 20px Georgia,serif}.outdoor{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;overflow:hidden}.outdoor div{padding:22px;border-right:1px solid var(--line)}.outdoor b{display:block;margin-top:8px;font:500 18px Georgia,serif}.quality{padding:27px}.quality li,.quality p{color:var(--muted);font-size:12px}@media(max-width:800px){.hero,.room{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.outdoor{grid-template-columns:1fr 1fr}.daily-wrap{grid-column:auto}.ranges{grid-template-columns:1fr}}@media(max-width:520px){.page{width:calc(100% - 22px)}.kpis{grid-template-columns:1fr}.hero aside{min-height:150px}}@media print{body{background:white}.page{width:100%}.card{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <main class="page">$body</main>
</body>
</html>
