name: Climate Report
version: 0.6.0
slug: climate_report
description: Weekly indoor temperature and humidity reports with outdoor context and year-over-year comparisons
url: https://github.com/fontanon/home-assistant-climate-report
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stdin: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
homeassistant_api: true
hassio_api: true
map:
  - type: addon_config
    read_only: false
options:
  timezone: Europe/Madrid
  language: es
  report_days: 7
  day_start: "08:00"
  night_start: "22:00"
  comparison: same_iso_week
  archive_reports: true
  dry_run: true
  push_notifier: ""
  home_assistant_url: ""
  email_enabled: false
  email_to: ""
  email_from: ""
  smtp_host: ""
  smtp_port: 587
  smtp_security: starttls
  smtp_username: ""
  smtp_password: ""
  weather_entity: ""
  rooms: []
  outdoor:
    temperature_entity: ""
    humidity_entity: ""
schema:
  timezone: str
  language: list(es|en)
  report_days: int(1,31)
  day_start: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  night_start: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  comparison: list(same_iso_week|same_dates|none)
  archive_reports: bool
  dry_run: bool
  push_notifier: str
  home_assistant_url: str
  email_enabled: bool
  email_to: str
  email_from: str
  smtp_host: str
  smtp_port: port
  smtp_security: list(starttls|ssl|none)
  smtp_username: str
  smtp_password: password
  weather_entity: str
  rooms:
    - name: str
      temperature_entity: str
      humidity_entity: str?
      exclude_from_summary: bool?
  outdoor:
    temperature_entity: str
    humidity_entity: str?
