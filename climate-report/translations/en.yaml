configuration:
  timezone:
    name: Time zone
    description: IANA time zone used to split days and weeks.
  language:
    name: Language
  report_days:
    name: Report days
  day_start:
    name: Day starts
  night_start:
    name: Night starts
  comparison:
    name: Comparison period
  archive_reports:
    name: Archive reports
    description: Keep a dated, browsable copy of every generated report.
  dry_run:
    name: Dry run
    description: Generate output without sending email.
  push_notifier:
    name: Push notification service
    description: Companion App service, for example notify.mobile_app_pixel_9a_de_felix.
  home_assistant_url:
    name: Home Assistant public URL
    description: Base HTTPS URL without a trailing path. Used by the email button, for example https://your-instance.ui.nabu.casa.
  email_enabled:
    name: Enable email delivery
  email_to:
    name: Recipient email
  email_from:
    name: Sender email
  smtp_host:
    name: SMTP server
  smtp_port:
    name: SMTP port
  smtp_security:
    name: SMTP security
  smtp_username:
    name: SMTP username
  smtp_password:
    name: SMTP password
  weather_entity:
    name: Weather entity
  rooms:
    name: Rooms
    description: Sensors and spaces shown in the report. Enable “Exclude from summary” for equipment such as water heaters.
    fields:
      name:
        name: Name
      temperature_entity:
        name: Temperature sensor
      humidity_entity:
        name: Humidity sensor
      exclude_from_summary:
        name: Exclude from home summary
        description: Still shown in the report, but omitted from global means, peaks and coverage.
  outdoor:
    name: Outdoor reference
