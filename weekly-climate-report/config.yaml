name: Weekly Climate Report
version: 0.1.0-dev
slug: weekly_climate_report
description: Generate weekly room temperature and humidity reports from Home Assistant statistics
url: https://github.com/example/ha-weekly-climate-report
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stdin: true
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  timezone: Europe/Madrid
  language: es
  report_days: 7
  day_start: "08:00"
  night_start: "22:00"
  comparison: same_iso_week
  archive_reports: true
  dry_run: true
  notifier: ""
  weather_entity: ""
  rooms: []
  outdoor:
    temperature_entity: ""
    humidity_entity: ""
schema:
  timezone: str
  language: list(es|en)
  report_days: int(1,31)
  day_start: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  night_start: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  comparison: list(same_iso_week|same_dates|none)
  archive_reports: bool
  dry_run: bool
  notifier: str
  weather_entity: str
  rooms:
    - name: str
      temperature_entity: str
      humidity_entity: str?
  outdoor:
    temperature_entity: str
    humidity_entity: str?
