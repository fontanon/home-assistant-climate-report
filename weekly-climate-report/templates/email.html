<!doctype html>
<html lang="$language">
<body style="margin:0;background:#f4f1e9;color:#17322d;font-family:Arial,sans-serif">
  <!-- Email clients require conservative table layout and inline styles. -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center" style="padding:24px">
      <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fffdf8">
        <tr><td style="padding:28px"><h1 style="margin:0 0 12px">$title</h1>$summary</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
